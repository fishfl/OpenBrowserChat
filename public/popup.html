<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OpenBrowserChat开源网页AI助手，Alt+V快速添加上下文，支持SKILL</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111;
      background: #fafafa;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 16px;
      letter-spacing: -0.01em;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      font-size: 12px;
      color: #444;
    }
    select, input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #eaeaea;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      color: #111;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #999;
      box-shadow: 0 0 0 1px #999;
    }
    textarea {
      height: 70px;
      resize: vertical;
    }
    input::placeholder, textarea::placeholder {
      color: #999;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      transition: background-color 0.15s;
    }
    button:hover {
      background-color: #333;
    }
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000;
    }
    #status {
      margin-top: 10px;
      color: #0f5132;
      font-size: 12px;
      text-align: center;
      height: 14px;
    }
    
    /* Tabs styling */
    .tabs {
      display: flex;
      border-bottom: 1px solid #eaeaea;
      margin-bottom: 16px;
      gap: 4px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      cursor: pointer;
      background-color: transparent;
      border-bottom: 2px solid transparent;
      font-size: 13px;
      color: #666;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover {
      color: #111;
    }
    .tab.active {
      color: #111;
      font-weight: 600;
      border-bottom: 2px solid #111;
      margin-bottom: -1px;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .footer-hint {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <h3>OpenBrowserChat配置</h3>
  
  <div class="tabs">
    <div class="tab active" data-target="config-pane">基础配置</div>
    <div class="tab" data-target="skills-pane">技能管理</div>
  </div>

  <div id="config-pane" class="tab-content active">
    <div class="form-group">
      <label for="providerSelect">选择服务供应商</label>
      <select id="providerSelect">
        <!-- Options are dynamically populated by popup.js -->
      </select>
    </div>
    <div class="form-group" id="customUrlGroup" style="display: none;">
      <label for="providerUrl">自定义 API URL</label>
      <input type="text" id="providerUrl" placeholder="如: https://api.openai.com/v1/chat/completions">
    </div>
    <div class="form-group">
      <label for="apiKey">API Key</label>
      <input type="text" id="apiKey" placeholder="你的 API Key">
    </div>
    <div class="form-group">
      <label for="model">Model Name</label>
      <input type="text" id="model" placeholder="如: deepseek-chat 或 qwen-max">
    </div>
    <div class="form-group">
      <label for="systemPrompt">System Prompt (全局提示词)</label>
      <textarea id="systemPrompt" placeholder="你是一个得力的助手..."></textarea>
    </div>
    <button id="saveBtn">保存配置</button>
    <div id="status"></div>
    <div class="footer-hint">
      提示：在任意网页按 <strong>Alt+X</strong> 呼出助手面板<br>
      项目地址: <a href="https://github.com/fishfl/OpenBrowserChat" target="_blank" style="color: #000; text-decoration: underline;">https://github.com/fishfl/OpenBrowserChat</a>
    </div>
  </div>

  <div id="skills-pane" class="tab-content">
    <div class="form-group">
      <label for="skillUpload" style="font-size: 12px; color: #555;">上传 .md 技能文件 (仅支持文本类 SKILL)</label>
      <input type="file" id="skillUpload" accept=".md" multiple style="font-size: 12px;">
    </div>
    <ul id="skillList" style="list-style: none; padding: 0; margin: 0; font-size: 13px;"></ul>
    <div class="footer-hint">提示：按 / 使用技能</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
